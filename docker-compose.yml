services:
  # ----------------------------------------------------------------------------
  # 1. Database: MySQL 8.0
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tiktok_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tiktok_crawler}
      MYSQL_USER: ${DB_USERNAME:-tiktok_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tiktok_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Main Web App: Laravel 13 + React SPA + Nginx + Queue Worker (All-in-One)
  # ----------------------------------------------------------------------------
  cms-app:
    build:
      context: ./cms-tiktok-crawler
      dockerfile: Dockerfile
    container_name: tiktok_cms_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${CMS_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-CMS TikTok Crawler}"
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FORCE_HTTPS: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tiktok_crawler}
      DB_USERNAME: ${DB_USERNAME:-tiktok_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDER: ${RUN_SEEDER:-true}
      AUTH_2FA_ENABLED: ${AUTH_2FA_ENABLED:-true}
      AUTH_EMAIL_OTP_ENABLED: ${AUTH_EMAIL_OTP_ENABLED:-false}
      # Internal communication to crawler-service via Docker Network
      CRAWLER_SERVICE_URL: ${CRAWLER_SERVICE_URL:-http://crawler-service:8001}
      CRAWLER_TOKEN: ${CRAWLER_TOKEN:-2703ac97eb897aacbf1235f5e608bf93d2ca7e0c2fe9d09a35e44f6ad6ab410c}
      CRAWLER_SERVICE_TOKEN: ${CRAWLER_SERVICE_TOKEN:-2703ac97eb897aacbf1235f5e608bf93d2ca7e0c2fe9d09a35e44f6ad6ab410c}
      CRAWLER_HMAC_SECRET: ${CRAWLER_HMAC_SECRET:-2703ac97eb897aacbf1235f5e608bf93d2ca7e0c2fe9d09a35e44f6ad6ab410c}
    volumes:
      - cms_storage:/var/www/html/storage
      - cms_avatars:/var/www/html/public/tiktok-accounts
    networks:
      - tiktok_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 3. Crawler Engine: Python FastAPI + SQLite WAL
  # ----------------------------------------------------------------------------
  crawler-service:
    build:
      context: ./tiktok-crawler-service
      dockerfile: Dockerfile
    container_name: tiktok_crawler_service
    restart: unless-stopped
    ports:
      - "${CRAWLER_PORT:-8001}:8001"
    environment:
      CRAWLER_HOST: "0.0.0.0"
      CRAWLER_PORT: 8001
      # Internal communication to cms-app via Docker Network
      LARAVEL_BASE_URL: ${LARAVEL_BASE_URL:-http://cms-app:80}
      LARAVEL_API_URL: ${LARAVEL_API_URL:-http://cms-app:80/admin/api/public/crawler}
      CRAWLER_TOKEN: ${CRAWLER_TOKEN:-2703ac97eb897aacbf1235f5e608bf93d2ca7e0c2fe9d09a35e44f6ad6ab410c}
      CRAWLER_HMAC_SECRET: ${CRAWLER_HMAC_SECRET:-2703ac97eb897aacbf1235f5e608bf93d2ca7e0c2fe9d09a35e44f6ad6ab410c}
    volumes:
      - crawler_data:/app/data
      - crawler_datasets:/app/datasets
    networks:
      - tiktok_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  tiktok_network:
    name: tiktok_network
    driver: bridge

volumes:
  mysql_data:
    name: tiktok_mysql_data
  cms_storage:
    name: tiktok_cms_storage
  cms_avatars:
    name: tiktok_cms_avatars
  crawler_data:
    name: tiktok_crawler_data
  crawler_datasets:
    name: tiktok_crawler_datasets
