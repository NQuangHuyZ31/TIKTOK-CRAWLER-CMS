name: Auto Draft Release on Version Bump

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'cms-tiktok-crawler/package.json'

permissions:
  contents: write

jobs:
  draft-release:
    name: Detect Version Bump & Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Previous and Current Version
        id: version_check
        run: |
          PREV_VERSION=$(git show HEAD~1:cms-tiktok-crawler/package.json 2>/dev/null | grep -o '"version": "[^"]*"' | cut -d'"' -f4 || echo "none")
          CURR_VERSION=$(grep -o '"version": "[^"]*"' cms-tiktok-crawler/package.json | cut -d'"' -f4 || echo "none")

          echo "Previous Version: $PREV_VERSION"
          echo "Current Version : $CURR_VERSION"

          if [ "$CURR_VERSION" != "none" ] && [ "$CURR_VERSION" != "$PREV_VERSION" ]; then
            echo "is_bumped=true" >> $GITHUB_OUTPUT
            echo "tag=v$CURR_VERSION" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
          else
            echo "is_bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.version_check.outputs.is_bumped == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cms-tiktok-crawler/package-lock.json

      - name: Validate & Build Distribution Bundle
        if: steps.version_check.outputs.is_bumped == 'true'
        working-directory: cms-tiktok-crawler
        run: |
          npm ci
          npm run check-types
          npx vite build || npm run mix:all

      - name: Package Release Archive
        if: steps.version_check.outputs.is_bumped == 'true'
        run: |
          mkdir -p dist
          tar -czf dist/cms-tiktok-crawler-${{ steps.version_check.outputs.tag }}.tar.gz \
            --exclude='cms-tiktok-crawler/node_modules' \
            --exclude='cms-tiktok-crawler/vendor' \
            --exclude='.git' \
            cms-tiktok-crawler ProcessData docker render.yaml

      - name: Generate Release Notes & Changelog
        if: steps.version_check.outputs.is_bumped == 'true'
        run: |
          TAG_NAME="${{ steps.version_check.outputs.tag }}"
          echo "## 🚀 Release $TAG_NAME" > changelog.md
          echo "" >> changelog.md
          echo "### 📝 What's Changed:" >> changelog.md
          git log -n 15 --pretty=format:"* %s (%h by @%an)" >> changelog.md
          echo "" >> changelog.md
          echo "---" >> changelog.md
          echo "> 💡 **Note**: This is an automated **Draft Release**. Please review the release notes and click **Publish release** when ready." >> changelog.md

      - name: Create or Update GitHub Draft Release
        if: steps.version_check.outputs.is_bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          name: "Release ${{ steps.version_check.outputs.tag }}"
          body_path: changelog.md
          draft: true
          prerelease: false
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
