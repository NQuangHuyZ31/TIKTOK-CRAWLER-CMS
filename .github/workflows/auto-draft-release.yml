name: Auto Draft Release on Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Optional manual version override (e.g. 1.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  draft-release:
    name: Prepare Draft Release Artifacts & Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Semantic Version & Check Draft Eligibility
        id: version_check
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            CURR_VERSION="${{ github.event.inputs.custom_version }}"
          else
            CURR_VERSION=$(grep -o '"version": "[^"]*"' cms-tiktok-crawler/package.json | cut -d'"' -f4 || echo "1.0.0")
          fi

          echo "Target Release Version: $CURR_VERSION"
          TAG="v$CURR_VERSION"

          # Check if an official (published, non-draft) release already exists for this tag
          IS_PUBLISHED=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | grep -o '"draft": false' || echo "")

          if [ -n "$IS_PUBLISHED" ]; then
            echo "Release $TAG is already PUBLISHED on GitHub. Will not overwrite an official release."
            echo "is_draft_eligible=false" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG is not published yet. Creating/updating Draft Release..."
            echo "is_draft_eligible=true" >> $GITHUB_OUTPUT
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js Runtime
        if: steps.version_check.outputs.is_draft_eligible == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cms-tiktok-crawler/package-lock.json

      - name: Validate & Build Distribution Bundle
        if: steps.version_check.outputs.is_draft_eligible == 'true'
        working-directory: cms-tiktok-crawler
        run: |
          npm ci
          npm run check-types
          npx vite build || npm run mix:prod

      - name: Package Release Archive Asset
        if: steps.version_check.outputs.is_draft_eligible == 'true'
        run: |
          mkdir -p dist
          tar -czf dist/cms-tiktok-crawler-${{ steps.version_check.outputs.tag }}.tar.gz \
            --exclude='cms-tiktok-crawler/node_modules' \
            --exclude='cms-tiktok-crawler/vendor' \
            --exclude='.git' \
            cms-tiktok-crawler ProcessData docker render.yaml

      - name: Generate SemVer Release Notes & Changelog
        if: steps.version_check.outputs.is_draft_eligible == 'true'
        run: |
          TAG="${{ steps.version_check.outputs.tag }}"
          SHA="${{ steps.version_check.outputs.commit_sha }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat <<EOF > changelog.md
          ## 📦 Draft Release Candidate $TAG

          - **Target Version**: \`$TAG\`
          - **Exact Commit SHA**: \`$SHA\`
          - **Generated Date**: \`$DATE\`
          - **Target Infrastructure**: Render.com (\`singapore\` region)

          ### 📝 Conventional Commits in this Release Candidate
          EOF

          # Extract conventional commits since last tag or last 25 commits
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h by @%an)" >> changelog.md
          else
            git log -n 25 --pretty=format:"* %s (%h by @%an)" >> changelog.md
          fi

          cat <<EOF >> changelog.md

          ---

          ### 🛡️ Automated Quality Gates Passed
          - [x] TypeScript Strict Compilation (\`tsc --noEmit\`, 0 errors)
          - [x] Backend Pest / PHPUnit Test Suite (100% passing)
          - [x] Frontend Asset Production Build Bundle generated

          ### ⚠️ Human Review & Production Deployment Gate
          > **MANDATORY HUMAN APPROVAL REQUIRED**:
          > - This is an automated **Draft Release**. It has **NOT** deployed to production.
          > - To deploy to Render production, the repository owner must review the release notes, verify changelog accuracy, and click **Publish release**.
          > - Publication will trigger the automated deployment workflow with health check verification and rollback protection.
          EOF

      - name: Create or Update GitHub Draft Release
        if: steps.version_check.outputs.is_draft_eligible == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          name: "Release ${{ steps.version_check.outputs.tag }}"
          target_commitish: ${{ steps.version_check.outputs.commit_sha }}
          body_path: changelog.md
          draft: true
          prerelease: false
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
