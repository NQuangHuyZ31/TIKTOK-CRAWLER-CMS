name: Auto Draft Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'cms-tiktok-crawler/package.json'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Optional manual version override (e.g. 1.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  draft-release:
    name: Prepare Draft Release Artifacts & Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract & Verify Semantic Version
        id: version_check
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            CURR_VERSION="${{ github.event.inputs.custom_version }}"
            PREV_VERSION="manual-dispatch"
            IS_BUMPED="true"
          else
            PREV_VERSION=$(git show HEAD~1:cms-tiktok-crawler/package.json 2>/dev/null | grep -o '"version": "[^"]*"' | cut -d'"' -f4 || echo "none")
            CURR_VERSION=$(grep -o '"version": "[^"]*"' cms-tiktok-crawler/package.json | cut -d'"' -f4 || echo "none")

            if [ "$CURR_VERSION" != "none" ] && [ "$CURR_VERSION" != "$PREV_VERSION" ]; then
              IS_BUMPED="true"
            else
              IS_BUMPED="false"
            fi
          fi

          echo "Previous Version : $PREV_VERSION"
          echo "Current Version  : $CURR_VERSION"
          echo "Is Version Bumped: $IS_BUMPED"

          echo "is_bumped=$IS_BUMPED" >> $GITHUB_OUTPUT
          echo "tag=v$CURR_VERSION" >> $GITHUB_OUTPUT
          echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js Runtime
        if: steps.version_check.outputs.is_bumped == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cms-tiktok-crawler/package-lock.json

      - name: Validate & Build Distribution Bundle
        if: steps.version_check.outputs.is_bumped == 'true'
        working-directory: cms-tiktok-crawler
        run: |
          npm ci
          npm run check-types
          npx vite build || npm run mix:prod

      - name: Package Release Archive Asset
        if: steps.version_check.outputs.is_bumped == 'true'
        run: |
          mkdir -p dist
          tar -czf dist/cms-tiktok-crawler-${{ steps.version_check.outputs.tag }}.tar.gz \
            --exclude='cms-tiktok-crawler/node_modules' \
            --exclude='cms-tiktok-crawler/vendor' \
            --exclude='.git' \
            cms-tiktok-crawler ProcessData docker render.yaml

      - name: Generate SemVer Release Notes & Changelog
        if: steps.version_check.outputs.is_bumped == 'true'
        run: |
          TAG="${{ steps.version_check.outputs.tag }}"
          SHA="${{ steps.version_check.outputs.commit_sha }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat <<EOF > changelog.md
          ## 📦 Release Candidate $TAG

          - **Release Version**: \`$TAG\`
          - **Candidate Commit SHA**: \`$SHA\`
          - **Generated Date**: \`$DATE\`
          - **Target Environment**: Render Production (\`cms-tiktok-web\`)

          ### 📝 Conventional Commits Changelog
          EOF

          # Extract conventional commits since last tag or last 25 commits
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h by @%an)" >> changelog.md
          else
            git log -n 25 --pretty=format:"* %s (%h by @%an)" >> changelog.md
          fi

          cat <<EOF >> changelog.md

          ---

          ### 🛡️ Safety & Quality Gates Passed
          - [x] TypeScript Strict Compilation (\`tsc --noEmit\`, 0 errors)
          - [x] Backend Pest / PHPUnit Test Suite (100% passing)
          - [x] Frontend Asset Production Build Bundle generated

          ### ⚠️ Approval & Production Deployment Gate
          > **IMPORTANT**: This is an automated **Draft Release**.
          > - Creating or saving this draft **DOES NOT** deploy to production.
          > - To deploy this release to Render production, review the notes, ensure changelog accuracy, and click **Publish release**.
          > - Publication will trigger the automated deployment workflow with post-deployment health checks and rollback traceability.
          EOF

      - name: Create or Update GitHub Draft Release
        if: steps.version_check.outputs.is_bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          name: "Release ${{ steps.version_check.outputs.tag }}"
          target_commitish: ${{ steps.version_check.outputs.commit_sha }}
          body_path: changelog.md
          draft: true
          prerelease: false
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
