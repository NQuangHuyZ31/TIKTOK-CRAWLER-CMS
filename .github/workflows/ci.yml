name: CI Workflow

on:
  push:
    branches: [ main, develop, 'worktree-*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  typecheck:
    name: Strict TypeScript Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms-tiktok-crawler
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cms-tiktok-crawler/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npm run check-types

  test:
    name: Backend Feature Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms-tiktok-crawler
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, redis
          coverage: none

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
